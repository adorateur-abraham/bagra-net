<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAGRA-NET</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{font-family:sans-serif;background:#000;color:#fff;overflow:hidden}.glass{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px)}#feed{scroll-snap-type:y mandatory;height:100vh;overflow-y:scroll}.video-card{scroll-snap-align:start}</style>
</head>
<body>
<div class="fixed top-0 w-full z-50 flex justify-between p-4 glass"><h1 class="font-black"><span style="color:#22d3ee">BAGRA</span>-NET</h1><div class="flex gap-2"><button onclick="openM('mon')" class="bg-yellow-400 text-black px-3 py-1 rounded-full text-xs font-bold">💰 MONÉTISATION</button><button onclick="openM('ia')" class="bg-purple-500 px-3 py-1 rounded-full text-xs font-bold">🤖 IA</button></div></div>
<div id="feed" class="pt-16 pb-20"></div>
<div class="fixed bottom-0 w-full bg-black border-t border-white/10 flex justify-around py-3 z-50"><button onclick="showTab('home')" class="text-white flex flex-col items-center"><i class="fa-solid fa-house"></i><span style="font-size:10px">Accueil</span></button><button onclick="showTab('gal')" class="text-white/50 flex flex-col items-center"><i class="fa-solid fa-images"></i><span style="font-size:10px">Galerie</span></button><button onclick="alert('🎥 LIVE bientôt BOSS!')" class="bg-white text-black w-12 h-8 rounded-lg flex items-center justify-center"><i class="fa-solid fa-plus"></i></button><button onclick="openM('mon')" class="text-white/50 flex flex-col items-center"><i class="fa-solid fa-sack-dollar"></i><span style="font-size:10px">Argent</span></button><button onclick="alert('Profil adorateur-abraham')" class="text-white/50 flex flex-col items-center"><i class="fa-solid fa-user"></i><span style="font-size:10px">Profil</span></button></div>
<div id="page-gal" class="hidden fixed inset-0 bg-black z-40 overflow-y-auto pt-16 pb-20 p-4"><h2 class="font-black text-2xl mb-4">Galerie BAGRA-NET</h2><div class="grid grid-cols-3 gap-2" id="grid"></div><button onclick="closeM()" class="fixed top-4 right-4 text-2xl"><i class="fa-solid fa-xmark"></i></button></div>
<div id="modal-photo" class="hidden fixed inset-0 bg-black/95 z-[60] flex items-center justify-center p-4"><button onclick="closeM()" class="absolute top-4 right-4 text-white text-3xl"><i class="fa-solid fa-xmark"></i></button><img id="mimg" src="" class="max-w-full max-h-[85vh] rounded-2xl"><p id="mcap" class="absolute bottom-10 w-full text-center font-bold"></p></div>
<div id="page-mon" class="hidden fixed inset-0 bg-gradient-to-b from-yellow-900 to-black z-[55] overflow-y-auto pt-16 pb-20 p-6"><button onclick="closeM()" class="absolute top-4 right-4 text-2xl"><i class="fa-solid fa-xmark"></i></button><h2 class="font-black text-3xl mt-8">💰 Monétisation</h2><div class="mt-6 space-y-4"><div class="glass rounded-2xl p-5 border border-yellow-400/30"><h3 class="font-bold text-yellow-400">Cadeaux Live</h3><p class="text-sm mt-2">Reçois Diamants, Lions. 1 Diamant = 0.005$. Retrait Airtel/Orange Money.</p><button class="mt-3 bg-yellow-400 text-black px-4 py-2 rounded-full font-bold w-full">Activer</button></div><div class="bg-white text-black rounded-2xl p-4 text-center font-black">Solde: 0.00 $ <br><span style="font-size:12px;font-weight:normal">Minimum 10$</span></div></div></div>
<div id="page-ia" class="hidden fixed inset-0 bg-gradient-to-b from-purple-900 to-black z-[55] flex flex-col pt-16"><div class="flex justify-between p-4 border-b border-white/10"><h2 class="font-black">🤖 BAGRA IA</h2><button onclick="closeM()" class="text-2xl"><i class="fa-solid fa-xmark"></i></button></div><div id="ia-chat" class="flex-1 overflow-y-auto p-4 space-y-3"><div class="glass rounded-2xl p-3 max-w-[80%]">Salut BOSS! Je suis BAGRA IA. Pose tes idées TikTok! 🚀</div></div><div class="p-4 flex gap-2"><input id="ia-input" placeholder="Demande à BAGRA IA..." class="flex-1 bg-white/10 rounded-full px-4 py-3 text-sm outline-none"><button onclick="askIA()" class="bg-purple-500 w-12 h-12 rounded-full"><i class="fa-solid fa-paper-plane"></i></button></div></div>
<script>
const videos=[{u:"@adorateur_abraham",d:"BAGRA-NET est là! Le TikTok 100% Africain 🔥 #kinshasa #rdc",l:"12.4K",i:"https://images.unsplash.com/photo-1531427186611-ecfd6d936c79?w=600"},{u:"@mama_bagra",d:"Recette pondu + fufu en direct! 🍲",l:"8.2K",i:"https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600"},{u:"@kin_live",d:"Kinshasa by night 🌃 Live Gombe",l:"22K",i:"https://images.unsplash.com/photo-1518837695005-2083093ee35c?w=600"},{u:"@bagra_officiel",d:"Comment monétiser ton live en 3 étapes! 💰",l:"15K",i:"https://images.unsplash.com/photo-1556157388-97ed244727b5?w=600"}];
const gal=[{s:"https://images.unsplash.com/photo-1531427186611-ecfd6d936c79?w=800",c:"Concert BAGRA - Stade des Martyrs"},{s:"https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=800",c:"Interview exclusive"},{s:"https://images.unsplash.com/photo-1517841905240-472988babdf9?w=800",c:"Cuisine Congolaise"},{s:"https://images.unsplash.com/photo-1518837695005-2083093ee35c?w=800",c:"Kinshasa Night"},{s:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=800",c:"Mode BAGRA"},{s:"https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=800",c:"Danse TikTok"}];
function render(){document.getElementById('feed').innerHTML=videos.map(v=>`<div class="video-card relative w-full h-[92vh] flex items-center justify-center overflow-hidden"><img src="${v.i}" class="absolute inset-0 w-full h-full object-cover"><div class="absolute inset-0 bg-gradient-to-b from-black/20 to-black/80"></div><div class="absolute bottom-20 left-4 right-20 text-white"><p class="font-bold">${v.u}</p><p class="text-sm mt-1">${v.d}</p></div><div class="absolute bottom-24 right-4 flex flex-col gap-6 text-white"><button class="flex flex-col items-center"><div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center"><i class="fa-solid fa-heart text-2xl"></i></div><span class="text-xs font-bold mt-1">${v.l}</span></button><button class="flex flex-col items-center"><div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center"><i class="fa-solid fa-comment-dots text-2xl"></i></div><span class="text-xs">342</span></button></div></div>`).join('');document.getElementById('grid').innerHTML=gal.map((g,i)=>`<img onclick="openP(${i})" src="${g.s}" class="w-full h-32 object-cover rounded-xl">`).join('');}
function openP(i){document.getElementById('mimg').src=gal[i].s;document.getElementById('mcap').innerText=gal[i].c;document.getElementById('modal-photo').classList.remove('hidden');}
function openM(n){closeM();document.getElementById('page-'+n).classList.remove('hidden');}
function showTab(t){closeM();if(t==='gal')document.getElementById('page-gal').classList.remove('hidden');}
function closeM(){document.getElementById('modal-photo').classList.add('hidden');document.getElementById('page-mon').classList.add('hidden');document.getElementById('page-ia').classList.add('hidden');document.getElementById('page-gal').classList.add('hidden');}
function askIA(){const inp=document.getElementById('ia-input');const chat=document.getElementById('ia-chat');if(!inp.value.trim())return;chat.innerHTML+=`<div class="ml-auto bg-white text-black rounded-2xl p-3 max-w-[80%] text-sm">${inp.value}</div>`;let q=inp.value;inp.value='';setTimeout(()=>{chat.innerHTML+=`<div class="glass rounded-2xl p-3 max-w-[80%] text-sm">Excellente idée BOSS! Poste à 19h heure Kinshasa avec #fyp #rdc 🔥 Ton contenu va percer!</div>`;chat.scrollTop=chat.scrollHeight;},700);}
render();
</script>
</body>
</html>
