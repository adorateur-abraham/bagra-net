<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAGRA-NET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:sans-serif}
.header{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(10,10,15,.95);z-index:100;border-bottom:1px solid #222}
.feed{margin-top:60px;height:calc(100vh - 120px);background:linear-gradient(135deg,#001122,#003366);position:relative;display:flex;flex-direction:column;justify-content:flex-end}
.actions{position:absolute;right:10px;top:45%;display:flex;flex-direction:column;gap:18px;text-align:center}
.act{width:48px;height:48px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.bottomInfo{padding:12px;background:linear-gradient(to top,rgba(0,0,0,.9),transparent)}
.nav{position:fixed;bottom:0;width:100%;display:flex;justify-content:space-around;background:#000;padding:12px 0 16px;border-top:1px solid #222;z-index:100}
.navItem{font-size:11px;color:#888;text-align:center} .navItem.active{color:#00f2ff}
.addBtn{width:52px;height:52px;background:#00f2ff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-size:32px;margin-top:-30px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);z-index:9999;justify-content:center;align-items:center}
.modalBox{background:#15151f;width:90%;max-width:360px;padding:24px;border-radius:22px;border:1px solid #222;text-align:center}
.input{width:100%;padding:15px;margin:8px 0;border-radius:14px;border:1px solid #333;background:#0e0e14;color:#fff}
.btnValidate{width:100%;padding:15px;background:#0066ff;color:#fff;border:none;border-radius:30px;font-weight:bold;margin-top:12px}
.profilPage{display:none;padding-top:65px;background:#0a0a0f;min-height:100vh;padding-bottom:80px}
</style>
</head>
<body>
<div class="header">
<div><b style="color:#00f2ff">BAGRA-NET</b></div>
<div id="authBtns" style="display:flex;gap:7px"><button onclick="openModal('login')" style="padding:8px 14px;border-radius:20px;background:transparent;border:1px solid #333;color:#fff;font-size:12px">Se connecter</button><button onclick="openModal('signup')" style="padding:8px 16px;border-radius:20px;background:#00f2ff;border:none;color:#000;font-weight:bold;font-size:12px">S'inscrire</button></div>
<div id="userBar" style="display:none;gap:8px;align-items:center"><span id="userNameShow" style="color:#00f2ff;font-size:13px"></span><button onclick="logout()" style="padding:6px 12px;border-radius:15px;background:#222;border:none;color:#fff;font-size:11px">Sortir</button></div>
</div>
<div id="feedPage" class="feed">
<div class="actions"><div><div class="act">❤️</div><b>12K</b></div><div><div class="act">💬</div><b>1K</b></div><div><div class="act">↗️</div><b>892</b></div></div>
<div class="bottomInfo"><h3 id="feedName">@adorateur_abraham</h3><p style="font-size:14px;margin-top:6px">Quand la foi et le style se rejoignent 🙌✨ #BAGRANET #RDC</p></div>
</div>
<div id="profilPage" class="profilPage">
<div style="height:160px;background:linear-gradient(90deg,#003366,#00f2ff);margin:0 12px;border-radius:16px"></div>
<div style="text-align:center;margin-top:-45px"><div style="width:95px;height:95px;border-radius:50%;border:3px solid #00f2ff;background:#222;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:40px">👤</div>
<h2 id="profilName" style="margin-top:15px">@adorateur_abraham</h2><p id="profilEmail" style="color:#888;font-size:13px">Membre BAGRA-NET</p>
<div style="display:flex;justify-content:center;gap:30px;margin-top:20px"><div><b>12</b><br><span style="font-size:11px;color:#888">Vidéos</span></div><div><b>1.2K</b><br><span style="font-size:11px;color:#888">Abonnés</span></div><div><b>340</b><br><span style="font-size:11px;color:#888">J'aime</span></div></div></div>
</div>
<div class="nav"><div class="navItem active" onclick="showFeed()">🏠<br>Accueil</div><div class="navItem">🖼️<br>Galerie</div><div class="addBtn">+</div><div class="navItem">💰<br>Argent</div><div class="navItem" onclick="showProfil()">👤<br>Profil</div></div>
<div id="authModal" class="modal"><div class="modalBox"><h2 id="modalTitle">S'inscrire</h2><p style="font-size:12px;color:#888;margin:10px 0">Rejoins BAGRA-NET 🔥</p><input id="inpUser" placeholder="Nom d'utilisateur" class="input"><input id="inpPass" type="password" placeholder="Mot de passe" class="input"><button onclick="doAuth()" class="btnValidate" id="btnAction">CRÉER MON COMPTE</button><p id="switchLink" style="font-size:12px;color:#00f2ff;margin-top:14px;text-decoration:underline"></p><div onclick="closeModal()" style="margin-top:12px;color:#555;font-size:13px">✕ Fermer</div><p id="msg" style="margin-top:12px;font-size:13px"></p></div></div>
<script>
let mode='signup';
function openModal(m){mode=m;document.getElementById('authModal').style.display='flex';document.getElementById('modalTitle').innerText=m==='signup'?'S\'inscrire':'Se connecter';document.getElementById('btnAction').innerText=m==='signup'?'CRÉER MON COMPTE':'SE CONNECTER';document.getElementById('switchLink').innerText=m==='signup'?'Déjà un compte ? Se connecter':'Pas de compte ? S\'inscrire'}
function closeModal(){document.getElementById('authModal').style.display='none';document.getElementById('msg').innerText=''}
document.getElementById('switchLink').onclick=()=>openModal(mode==='signup'?'login':'signup');
function doAuth(){const u=document.getElementById('inpUser').value.trim();const p=document.getElementById('inpPass').value.trim();const msg=document.getElementById('msg');if(!u||!p){msg.style.color='orange';msg.innerText='⚠️ Remplis tout';return}if(mode==='signup'){let users=JSON.parse(localStorage.getItem('bagra_users')||'{}');if(users[u]){msg.style.color='red';msg.innerText='❌ Existe déjà';return}users[u]=p;localStorage.setItem('bagra_users',JSON.stringify(users));localStorage.setItem('bagra_current',u);msg.style.color='#00ff88';msg.innerText='✅ Compte créé!';setTimeout(()=>{closeModal();updateUI()},1000)}else{let users=JSON.parse(localStorage.getItem('bagra_users')||'{}');if(users[u]===p){localStorage.setItem('bagra_current',u);msg.style.color='#00ff88';msg.innerText='✅ Connecté!';setTimeout(()=>{closeModal();updateUI()},800)}else{msg.style.color='red';msg.innerText='❌ Faux mot de passe'}}}
function updateUI(){const cur=localStorage.getItem('bagra_current');if(cur){document.getElementById('authBtns').style.display='none';document.getElementById('userBar').style.display='flex';document.getElementById('userNameShow').innerText='@'+cur;document.getElementById('feedName').innerText='@'+cur;document.getElementById('profilName').innerText='@'+cur;document.getElementById('profilEmail').innerText=cur+' - Membre'}else{document.getElementById('authBtns').style.display='flex';document.getElementById('userBar').style.display='none'}}
function logout(){localStorage.removeItem('bagra_current');updateUI();showFeed()}
function showProfil(){document.getElementById('profilPage').style.display='block';document.getElementById('feedPage').style.display='none'}
function showFeed(){document.getElementById('profilPage').style.display='none';document.getElementById('feedPage').style.display='flex'}
updateUI();
</script>
</body>
</html>
